<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dash-token" content="__DASH_TOKEN__">
<title>Orchestrator</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --mut:#667085; --line:#e4e7ec; --card:#f8f9fb; --warn:#b42318; --warnbg:#fef3f2; --ok:#067647; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --fg:#e6e8eb; --mut:#98a2b3; --line:#2a2f37; --card:#1b1f26; --warn:#fda29b; --warnbg:#3a1a18; --ok:#6ce9a6; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:14px; }
  h1 { font-size:16px; margin:0; } h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); margin:0 0 8px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; }
  .need { background:var(--warnbg); border-color:var(--warn); } .need h2 { color:var(--warn); }
  table { width:100%; border-collapse:collapse; } td,th { text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:500; } .mut { color:var(--mut); } code { font-size:12px; }
  .pill { display:inline-block; padding:0 7px; border-radius:9px; border:1px solid var(--line); font-size:12px; margin-right:4px; }
  .done { color:var(--ok); } .escalated,.failed { color:var(--warn); }
  details { margin:2px 0; } ul { margin:4px 0 4px 18px; padding:0; }
  .scroll { max-height:320px; overflow:auto; }
  .item { padding:8px 0; border-top:1px solid var(--line); } .item:first-child { border-top:0; }
  .why { margin:4px 0; white-space:pre-wrap; }
  textarea { width:100%; font:inherit; padding:6px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  button { font:inherit; padding:4px 12px; border-radius:6px; border:1px solid var(--warn); background:var(--warn); color:#fff; cursor:pointer; }
  button.sec { background:transparent; color:var(--warn); } button:disabled { opacity:.5; cursor:default; }
  .btns { margin-top:6px; display:flex; gap:8px; align-items:center; }
  .st { display:inline-block; min-width:74px; text-align:center; padding:0 6px; border-radius:9px; font-size:12px; border:1px solid var(--line); }
  .st.thinking { background:#dbeafe; color:#1e40af; } .st.tool { background:#ede9fe; color:#5b21b6; }
  .st.waiting { background:#f1f5f9; color:#475569; } .st.reviewing, .st.integrating, .st.verifying, .st.checking { background:#fef3c7; color:#92400e; }
  .st.done { background:#dcfce7; color:#166534; } .st.cancelled { background:#f1f5f9; color:#64748b; } .st.escalated, .st.failed { background:#fee2e2; color:#991b1b; }
  .st.asking, .st.needs_clarification { background:#ffedd5; color:#9a3412; } .st.starting { background:#e0f2fe; color:#075985; }
  .st.stale { opacity:.45; }
  .dept { margin:6px 0 2px; font-weight:600; } .agent td { padding:2px 6px; }
</style>
</head>
<body>
<main>
  <h1>Orchestrator <span id="stamp" class="mut"></span></h1>
  <section id="resume-sec" hidden><b>No run is active, but <span id="un-n"></span> ticket(s) are unfinished</b>
    <span class="mut">(typical after a restart, crash or power cut)</span>
    <div class="btns"><button id="resume-btn">Resume run</button><span class="msg" id="resume-msg"></span></div></section>
  <section class="need" id="need-sec" hidden><h2>Needs human</h2><div id="need"></div></section>
  <section id="code-sec" hidden><h2>Code awaiting review <span class="mut" id="code-n"></span></h2><div id="code-list"></div>
    <div class="mut">Review with <code>ctl code show ID</code>, then <code>ctl code accept ID</code> or <code>ctl code reject ID "feedback"</code>.</div></section>
  <section id="handling-sec" hidden><details><summary><b>Being handled below you</b> <span class="mut" id="hn"></span></summary><div id="handling"></div></details></section>
  <div class="grid">
    <section style="grid-column: 1 / -1"><h2>Team <span class="mut" id="team-sum"></span></h2><div id="team"></div></section>
    <section><h2>Hardware</h2><div id="hw"></div></section>
    <section><h2>Spend</h2><div id="spend"></div></section>
  </div>
  <section><h2>Tickets</h2><div id="counts"></div><div class="scroll" id="board"></div></section>
  <section><h2>Event feed</h2><div class="scroll" id="events"></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rows = (a, f) => a.map(f).join("");
function workerSummary(ws) {
  if (!ws.length) return "no workers";
  const c = {}; ws.forEach(w => c[w.status] = (c[w.status] || 0) + 1);
  return ws.length + " worker" + (ws.length > 1 ? "s" : "") + " (" + Object.entries(c).map(([k, v]) => v + " " + k).join(", ") + ")";
}
const TOKEN = document.querySelector('meta[name="dash-token"]').content;
let needSig = "";
function renderNeed(items) {
  $("need-sec").hidden = !items.length;
  document.title = (items.length ? "(" + items.length + ") " : "") + "Orchestrator";
  const sig = JSON.stringify(items.map(n => [n.id, n.status, n.why, n.detail]));
  if (sig === needSig) return;                       // unchanged: don't wipe what you're typing
  const typed = {};
  document.querySelectorAll("#need textarea").forEach(t => typed[t.dataset.id] = t.value);
  needSig = sig;
  $("need").innerHTML = rows(items, n => {
    const q = n.status === "needs_clarification", prop = n.kind === "proposal";
    return `<div class="item" data-id="${esc(n.id)}"><div><b>${esc(n.title)}</b> <code>${esc(n.id)}</code> ` +
      `<span class="pill">${esc(n.status)}</span> <span class="mut">${esc(n.level)} · ${esc(String(n.assignee).replace(/^worker:/, ""))}</span></div>` +
      `<div class="why">${esc(q ? n.detail : n.why) || "(no reason recorded)"}</div>` +
      `<textarea data-id="${esc(n.id)}" rows="2" placeholder="${q ? "Your answer" : "Guidance for the retry (optional)"}">${esc(typed[n.id] || "")}</textarea>` +
      `<div class="btns">${q ? '<button data-act="answer">Answer</button>' : prop ? '<button data-act="retry">Approve</button>' : '<button data-act="retry">Retry</button>'}` +
      `<button data-act="cancel" class="sec">${prop ? "Decline" : "Cancel ticket"}</button><span class="msg"></span></div></div>`;
  });
}
$("need").addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const item = b.closest(".item"), msg = item.querySelector(".msg");
  b.disabled = true; msg.textContent = "working...";
  try {
    const r = await fetch("/api/action", { method: "POST",
      headers: { "Content-Type": "application/json", "X-Dashboard-Token": TOKEN },
      body: JSON.stringify({ action: b.dataset.act, ticket_id: item.dataset.id, text: item.querySelector("textarea").value }) });
    const j = await r.json();
    if (!r.ok) { msg.textContent = j.error || ("error " + r.status); b.disabled = false; return; }
    msg.textContent = j.run_started ? "done; run restarted" : "done";
    needSig = ""; tick();
  } catch (err) { msg.textContent = "failed: " + err; b.disabled = false; }
});
$("resume-btn").addEventListener("click", async () => {
  const b = $("resume-btn"), m = $("resume-msg");
  b.disabled = true; m.textContent = "starting...";
  try {
    const r = await fetch("/api/resume", { method: "POST", headers: { "X-Dashboard-Token": TOKEN } });
    const j = await r.json();
    m.textContent = r.ok ? "run started" : (j.error || ("error " + r.status));
  } catch (err) { m.textContent = "failed: " + err; }
  b.disabled = false; tick();
});
function ago(ts) {
  const sec = Math.max(0, (Date.now() - Date.parse(ts)) / 1000);
  return sec < 60 ? Math.round(sec) + "s" : sec < 3600 ? Math.round(sec / 60) + "m" : (sec / 3600).toFixed(1) + "h";
}
const fmt = n => (n || 0).toLocaleString();
function renderTeam(s) {
  const finished = new Set(["done", "failed", "escalated"]);
  const depts = {};
  s.agents.forEach(a => (depts[a.department || "?"] = depts[a.department || "?"] || []).push(a));
  const active = s.agents.filter(a => !finished.has(a.state)).length;
  $("team-sum").textContent = active + " active, " + (s.agents.length - active) + " finished" + (s.run_active ? "" : " (no run active)");
  $("team").innerHTML = Object.keys(depts).length ? rows(Object.entries(depts), ([d, list]) => {
    const u = s.usage_by_department[d] || {};
    return `<div class="dept">${esc(d)} <span class="mut">${list.filter(a => !finished.has(a.state)).length} active · ` +
      `${fmt(u.input_tokens)} in / ${fmt(u.output_tokens)} out tokens · ${fmt(u.calls)} calls</span></div><table>` +
      rows(list, a => `<tr class="agent"><td>${a.kind === "manager" ? "<b>" + esc(a.name) + "</b>" : esc(String(a.name).replace(/^worker:/, ""))}</td>` +
        `<td><span class="st ${esc(a.state)}${!s.run_active && !finished.has(a.state) ? " stale" : ""}">${esc(a.state)}</span> <span class="mut">${ago(a.since)}</span></td>` +
        `<td class="mut">${esc(a.detail)}</td><td>${esc((a.ticket_title || "").slice(0, 60))}</td>` +
        `<td class="mut">${fmt(a.calls)} calls · ${fmt(a.tokens_in + a.tokens_out)} tok</td></tr>`) + `</table>`;
  }) : '<span class="mut">nobody has started yet</span>';
}
function render(s) {
  $("resume-sec").hidden = !s.unfinished.length;
  $("un-n").textContent = s.unfinished.length;
  renderNeed(s.needs_human);
  $("code-sec").hidden = !s.code_pending.length;
  $("code-n").textContent = "(" + s.code_pending.length + ")";
  $("code-list").innerHTML = rows(s.code_pending, c => `<div class="item"><b>${esc(c.title)}</b> <code>${esc(c.id)}</code> ` +
    `<span class="mut">${c.files.length} file(s): ${esc(c.files.join(", "))}</span><div class="mut">${esc(c.summary)}</div></div>`);
  $("handling-sec").hidden = !s.handling.length;
  $("hn").textContent = s.handling.length + " item" + (s.handling.length === 1 ? "" : "s") + " your managers are working on";
  $("handling").innerHTML = rows(s.handling, n => `<div class="item"><b>${esc(n.title)}</b> <code>${esc(n.id)}</code> ` +
    `<span class="pill">${esc(n.kind === "proposal" ? "proposal" : n.status)}</span> <span class="mut">with ${n.route === "manager" ? "its department manager" : "the top manager"}</span>` +
    `<div class="mut">${esc(n.why || n.detail)}</div></div>`);
  renderTeam(s);
  $("hw").innerHTML = (s.resources.length ? `<table><tr><th>resource</th><th>state</th><th>holder</th><th>safe to stop</th></tr>` +
    rows(s.resources, r => `<tr><td>${esc(r.name)}</td><td>${esc(r.state)}</td><td>${esc(r.holder_ticket ?? "")}</td><td class="mut">${esc(r.safe_to_stop)}</td></tr>`) + `</table>` : '<span class="mut">no resources registered</span>') +
    (s.jobs.length ? `<table style="margin-top:8px"><tr><th>job</th><th>name</th><th>state</th><th>resource</th></tr>` +
    rows(s.jobs, j => `<tr><td><code>${esc(j.id)}</code></td><td>${esc(j.name)}</td><td class="${j.state === "exited" && j.exit_code ? "failed" : ""}">${esc(j.state)}${j.exit_code ? " (" + esc(j.exit_code) + ")" : ""}</td><td>${esc(j.resource ?? "")}</td></tr>`) + `</table>` : "");
  const sp = s.spend, tot = sp.input_tokens + sp.output_tokens;
  const ud = Object.entries(s.usage_by_department || {});
  const deptTable = ud.length ? `<table style="margin-top:6px"><tr><th>department</th><th>calls</th><th>input</th><th>cached</th><th>output</th></tr>` +
    rows(ud, ([d, u]) => `<tr><td>${esc(d)}</td><td>${fmt(u.calls)}</td><td>${fmt(u.input_tokens)}</td><td class="mut">${fmt(u.cache_hit_tokens)}</td><td>${fmt(u.output_tokens)}</td></tr>`) + `</table>` : "";
  const integ = s.integration && s.integration.exists ? `<div class="mut" style="margin-top:6px">integration branch <code>${esc(s.integration.branch)}</code>: ` +
    `${s.integration.ahead} commit(s) ahead of ${esc(s.integration.base)}</div>` : "";
  const bal = Object.entries(sp.balances || {}).map(([p, b]) => b.usd !== undefined
    ? `<b>${esc(p)}</b> balance $${Number(b.usd).toFixed(2)}${sp.stop_below_balance_usd != null && b.usd < sp.stop_below_balance_usd ? ' <span class="failed">below floor</span>' : ""}`
    : `<span class="mut">${esc(p)} balance unavailable (${esc(b.error || "?")})</span>`).join(" · ");
  const money = `<div>${bal || '<span class="mut">no provider reports a balance</span>'}` +
    `${sp.stop_below_balance_usd != null ? ' <span class="mut">(runs stop below $' + Number(sp.stop_below_balance_usd).toFixed(2) + ")</span>" : ""}</div>` +
    `<div class="mut">estimated spend ${sp.estimated_usd != null ? "$" + Number(sp.estimated_usd).toFixed(2) : "unknown (no prices)"}${sp.max_cost_usd ? " of $" + sp.max_cost_usd + " cap" : ""}</div>`;
  const skipped = (s.unavailable_models || []).length ? `<div style="margin-top:6px"><b>Models skipped</b> (quota or limit) ` +
    rows(s.unavailable_models, m => `<div class="mut"><code>${esc(m.model)}</code> ${ago(m.ts)} ago: ${esc(String(m.why).slice(0, 140))}</div>`) + `</div>` : "";
  $("spend").innerHTML = money + skipped + deptTable + integ + `<div>${tot.toLocaleString()} tokens <span class="mut">(${sp.input_tokens.toLocaleString()} in / ${sp.output_tokens.toLocaleString()} out)</span></div>` +
    `<div class="mut">budget: ${sp.max_tokens ? tot.toLocaleString() + " / " + sp.max_tokens.toLocaleString() + " tokens" : "none"}${sp.max_cost_usd ? ", $" + sp.max_cost_usd + " cap" : ""}</div>`;
  $("counts").innerHTML = rows(Object.entries(s.by_status), ([k, v]) => `<span class="pill ${esc(k)}">${esc(k)} ${v}</span>`) || '<span class="mut">no tickets</span>';
  const mdl = m => Object.entries(m || {}).map(([k, v]) => k + ": " + v).join(", ");
  $("board").innerHTML = s.board.length ? `<table><tr><th>id</th><th>title</th><th>status</th><th>assignee</th><th>rigor</th><th>models</th><th>trace</th></tr>` +
    rows(s.board, t => `<tr><td><code>${esc(t.id)}</code></td><td>${esc(t.title)}</td><td class="${esc(t.status)}">${esc(t.status)}</td><td>${esc(t.assignee)}</td><td class="mut">${esc(t.rigor)}</td><td class="mut">${esc(mdl(t.models))}</td><td class="mut">${esc(t.trace.join(" > "))}</td></tr>`) + `</table>` : "";
  $("events").innerHTML = `<table>` + rows(s.events, e =>
    `<tr><td class="mut">${esc(e.ts.slice(11, 19))}</td><td>${esc(e.actor)}</td><td>${esc(e.type)}</td><td class="mut">${esc(e.ticket_id ?? "")} ${esc(JSON.stringify(e.payload))}</td></tr>`) + `</table>`;
  $("stamp").textContent = "updated " + new Date().toLocaleTimeString() + (s.run_active ? " · run active" : " · no run active");
}
async function tick() {
  try { render(await (await fetch("/api/state")).json()); }
  catch (e) { $("stamp").textContent = "disconnected"; }
}
tick(); setInterval(tick, 2000);
</script>
</body>
</html>

# Example top-level config. Copy to orchestrator.yaml. Never commit API keys;
# reference them by environment variable name.

workspace: ./workspace

providers:
  # Provider-agnostic. Add any that implement the provider interface.
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
  deepseek:                     # OpenAI-format API; models: deepseek-flash, deepseek-v4-pro
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    max_output_tokens: 32000

models:
  # Logical tiers -> concrete models. Higher in the hierarchy uses higher tiers.
  director: { provider: anthropic, model: claude-opus-5-5 }
  manager: { provider: anthropic, model: claude-opus-5-5 }
  worker:  { provider: anthropic, model: claude-sonnet-5-5 }   # cheaper tier; change if you prefer
  # Mixed-vendor example: Claude on top, DeepSeek below. Each tier's `provider` routes its model.
  #   director: { provider: anthropic, model: claude-opus-5-5 }
  #   manager: { provider: deepseek,  model: deepseek-v4-pro }
  #   worker:  { provider: deepseek,  model: deepseek-flash }
  fallback_chain: []   # capability fallbacks, tried in order when a worker's reply fails (e.g. [{provider: deepseek, model: deepseek-v4-pro}]). Never used to route around safety refusals.

budget:
  # Default: no limits. Set any of these to enable.
  max_cost_usd: null      # not enforced yet
  max_tokens: null
  max_minutes: null

policies:
  capability_retry_limit: 3
  on_safety_refusal: retry_once_then_escalate_to_human   # never auto-reroute
  max_subworker_depth: 2      # worker -> sub-worker; tune as we learn
  max_children_per_agent: 5
  max_worker_retries: 2       # manager retries per worker before it must delegate differently or give up
  default_rigor: balanced     # quick_and_dirty | balanced | rigorous
  verification_is_advisory: true

verification:
  enabled: true                # independent advisory check on every manager result
  verifier_models:             # distinct models for diversity (add other providers' models later)
    - claude-opus-5-5
    - claude-sonnet-5-5
  max_rounds: 2                # verification passes per ticket before the manager's decision stands

departments:
  research:
    manager_role: roles/research_manager.md
    can_acquire_tools: false
  tooling:
    manager_role: roles/tooling_manager.md
    can_acquire_tools: true          # only department allowed to clone/install tools
  experiment:
    manager_role: roles/experiment_manager.md
    can_acquire_tools: false
    resource_leases: true            # lock physical hardware
  verification:
    manager_role: roles/verification_manager.md
    can_acquire_tools: false
    diverse_models: true
  # Add more departments here.

interfaces:
  cli: true
  dashboard: { enabled: true, port: 8080 }

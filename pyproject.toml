[project]
name = "orchestrator"
version = "0.0.1"
description = "Hierarchical LLM research-lab orchestrator"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["jsonschema>=4", "pyyaml>=6", "fastapi>=0.110", "uvicorn>=0.29", "psutil>=5", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest"]
anthropic = ["anthropic>=1"]

[tool.setuptools]
packages = ["orchestrator"]

[tool.setuptools.package-data]
orchestrator = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
